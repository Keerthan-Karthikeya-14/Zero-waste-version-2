<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroWaste - Register</title>
    <link rel="icon" href="../assets/logo.jpg" type="image/jpg">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .register-form {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-register:hover {
            background: #45a049;
        }
        .error-message {
            color: #f44336;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f44336;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
        }
        .login-link a {
            color: #4CAF50;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="../assets/logo.jpg" alt="ZeroWaste" style="width: 80px; height: 80px; margin-bottom: 10px;">
            <h1 style="color: #4CAF50; margin: 0;">ZeroWaste</h1>
            <p style="color: #666; margin: 5px 0;">Create Your Account</p>
        </div>
        
        <!-- Error Message
        <% if (request.getAttribute("errorMessage") != null) { %>
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <%= request.getAttribute("errorMessage") %>
        </div>
        <% } %> -->
        
        <!-- Registration Form -->
        <form class="register-form" action="RegisterServlet" method="POST">
            <div class="form-group">
                <label for="fullName">
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" id="fullName" name="fullName" required 
                       placeholder="Enter your full name" 
                     />
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="email" name="email" required 
                       placeholder="Enter your email" 
                   />
            </div>
            
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" required 
                       placeholder="Enter your password (min 6 characters)">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" id="confirmPassword" name="confirmPassword" required 
                       placeholder="Confirm your password">
            </div>
            
            <div class="form-group">
                <label for="role">
                    <i class="fas fa-user-tag"></i> Register As
                </label>
                <select id="role" name="role" required>
                    <option value="">Select your role</option>
                    <option value="DONOR" <%= request.getAttribute("role") != null && request.getAttribute("role").equals("DONOR") ? "selected" : "" %>>Donor</option>
                    <option value="RECEIVER" <%= request.getAttribute("role") != null && request.getAttribute("role").equals("RECEIVER") ? "selected" : "" %>>Receiver</option>
                    <option value="ADMIN" <%= request.getAttribute("role") != null && request.getAttribute("role").equals("ADMIN") ? "selected" : "" %>>Administrator</option>
                </select>
            </div>
            
            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Register Account
            </button>
        </form>
        
        <div class="login-link">
            <p>Already have an account? <a href="index.html">Login here</a></p>
        </div>
    </div>
</body>
</html>
